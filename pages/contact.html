<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gwińe'eskw - Contact</title>
    <link rel="stylesheet" href="../styles.css" />
    <script src="../scripts.js" defer></script>
    <script src="../background.js" defer></script>
  </head>
  <body>
    <canvas id="bgCanvas" aria-hidden="true"></canvas>
    <div id="nav-container"></div>

    <main>
      <header class="about-hero">
        <p class="eyebrow">Contact</p>
        <h1>gwińe'eskw</h1>
        <p class="home-subtitle">(to ask/send a message)</p>
      </header>

      <section class="contact-form-card">
        <form id="contactForm" novalidate>
          <div class="form-grid">
            <div class="form-group">
              <label for="name">Naahl wanis? (Your Name)</label>
              <input type="text" id="name" name="name" required placeholder="Jane Doe" />
            </div>

            <div class="form-group">
              <label for="email">sileta (email)</label>
              <input type="email" id="email" name="email" required placeholder="name@example.com" />
            </div>

            <div class="form-group full">
              <label for="message">aguhl hasag̲an? (What do you want?)</label>
              <textarea id="message" name="message" rows="5" required placeholder="Write your message here..."></textarea>
            </div>
          </div>

          <div style="margin-top: 22px;">
            <button type="submit" class="submit-btn" id="submitBtn">
              <span>hlaa hlisgwina? (Are you finished?)</span>
            </button>
          </div>
        </form>
      </section>

      <dialog id="thankYouModal" class="popup-modal">
        <div class="popup-box">
          <h2>T'ooyak̲siý ńiin!</h2>
          <p>(Thank you)! Your message has been saved.</p>
          <button type="button" id="closeModalBtn" class="modal-close-btn">Close</button>
        </div>
      </dialog>
    </main>
  </body>
</html>
