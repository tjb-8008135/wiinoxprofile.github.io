<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A welcoming home page with a mood selector and animated background."
    />
    <title>Home | Aam wilaa wilina?</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="scripts.js" defer></script>
    <script src="background.js" defer></script>
  </head>
  <body>
    <canvas id="bgCanvas" aria-hidden="true"></canvas>
    <div id="nav-container" aria-label="Main navigation"></div>

    <main class="page-shell">
      <header class="homeheader">
       
        <h1>Ńit, Aam wilaa wilina?</h1>
        <p class="home-subtitle">(Hello, How are you doing?)</p>

        <div class="home-gif-container">
          <img
            src="./images/aamwilaa.GIF"
            class="home-gif-media"
            alt="Illustrated character walking along a path"
          />
        </div>
      </header>

      <section class="mood-container" aria-labelledby="mood-heading">
        <h2 id="mood-heading">Aam wilaa hina? (How are you feeling?)</h2>

        <div class="mood-buttons" role="group" aria-label="Choose your mood">
          <button class="mood-btn" type="button" data-mood="happy" aria-pressed="false">
            <span class="btn-emoji" aria-hidden="true">😊</span>
            <span>luu'aamhl goodiý</span>
          </button>

          <button class="mood-btn" type="button" data-mood="sad" aria-pressed="false">
            <span class="btn-emoji" aria-hidden="true">😢</span>
            <span>luug̲etkwhl goodiý</span>
          </button>

          <button class="mood-btn" type="button" data-mood="mad" aria-pressed="false">
            <span class="btn-emoji" aria-hidden="true">😠</span>
            <span>siipkw goodiý</span>
          </button>

          <button class="mood-btn" type="button" data-mood="tired" aria-pressed="false">
            <span class="btn-emoji" aria-hidden="true">🥱</span>
            <span>plakskw n̂iiý</span>
          </button>
        </div>

        <div class="mood-display" id="moodDisplay" aria-live="polite" aria-atomic="true">
          <div class="face-stage" id="faceStage" aria-hidden="true">✨</div>
          <div class="mood-label" id="moodLabel">Select how you feel</div>
        </div>
      </section>
    </main>

   <script>
  (function() {
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby6Y-fzva4AklgtxB_3p7I94bO9n8bVFaMoaZMnVF5EV2NwkgALy5BM6F-k9NYKX7XUfA/exec";

    const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
    const deviceType = isMobile ? "Mobile" : "Desktop";

    let trafficSource = "Direct";
    if (document.referrer) {
      if (document.referrer.includes("google.")) trafficSource = "Organic Search";
      else if (document.referrer.includes("github.io")) trafficSource = "Referral";
      else trafficSource = "Referral";
    }

    let visitorId = localStorage.getItem("site_visitor_id");
    if (!visitorId) {
      visitorId = "usr_" + Math.random().toString(36).substring(2, 8);
      localStorage.setItem("site_visitor_id", visitorId);
    }

    const payload = {
      path: window.location.pathname,
      source: trafficSource,
      device: deviceType,
      visitor: visitorId
    };

    fetch(WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(payload)
    }).catch(function(err) {
      console.warn("View tracking error:", err);
    });
  })();
</script>
  </body>
</html>
